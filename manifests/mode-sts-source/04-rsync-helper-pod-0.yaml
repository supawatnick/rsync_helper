# rsync-helper-0 — จับคู่กับ filewriter-0 (STS ordinal 0)
# source STS (filewriter) มี 3 replicas: filewriter-0 (node w1), filewriter-1 (w2), filewriter-2 (w1)
#
# การจับคู่:
#   rsync-helper-0 → filewriter-0 → node k8s-clus1-w1
#   src: data-filewriter-0        (PVC ที่ app ordinal 0 ใช้ — iSCSI, RWO)
#   dst: data-filewriter-nfs-0    (PVC ปลายทาง — NFS)
#   log: rsync-helper-log-0       (PVC log)
#
# ⚠️ nodeName ต้องตรง node ของ filewriter-0 (RWO → ต้องอยู่ node เดียวกับ data)
# ⚠️ source mount เป็น readOnly (ป้องกันเขียนผิดที่แหล่งข้อมูล)
apiVersion: v1
kind: Pod
metadata:
  name: rsync-helper-0
  namespace: demo
  labels:
    app: rsync-helper
    replica: "0"
    source: statefulset
spec:
  nodeName: k8s-clus1-w1
  restartPolicy: Never
  automountServiceAccountToken: false
  containers:
    - name: rsync
      image: <REGISTRY_HOST>/<PROJECT>/rsync-helper:1.0.0
      env:
        - name: TZ
          value: Asia/Bangkok
      command: ["sh", "-c"]
      args:
        - |
          LOG_DIR=/var/log/rsync
          LOG_FILE=$LOG_DIR/sync-history-pod-0.log
          mkdir -p $LOG_DIR

          ITER=0

          echo "[$(date '+%Y-%m-%d %H:%M:%S %Z')] Rsync helper pod-0 started (interval: 300s, log: $LOG_FILE)" | tee -a $LOG_FILE

          while true; do
            ITER=$((ITER+1))
            TS=$(date '+%Y-%m-%d %H:%M:%S %Z')

            {
              echo ""
              echo "========================================================"
              echo "[$TS] ITERATION #$ITER starting (pod-0)"
              echo "========================================================"

              echo ""
              echo "[$TS] Files BEFORE sync:"
              echo "  /src/ ($(ls /src/ 2>/dev/null | wc -l) entries):"
              ls -la /src/ 2>/dev/null | tail -n +2 | awk '{print "    " $0}'
              echo "  /dst/ ($(ls /dst/ 2>/dev/null | wc -l) entries):"
              ls -la /dst/ 2>/dev/null | tail -n +2 | awk '{print "    " $0}'

              echo ""
              echo "[$TS] Running rsync (avzPi --delete --timeout=10)..."
              RSYNC_OUT=$(rsync -avzPi --delete --timeout=10 /src/ /dst/ 2>&1)
              RSYNC_EXIT=$?
              echo "$RSYNC_OUT"

              echo ""
              echo "[$TS] === CHANGE SUMMARY ==="
              NEW=$(echo "$RSYNC_OUT" | grep -c '^>f++++++++++')
              MOD=$(echo "$RSYNC_OUT" | grep -E '^>f\.' | grep -vc '^>f++++++++++')
              DEL=$(echo "$RSYNC_OUT" | grep -c '^\*deleting')
              DIRCHG=$(echo "$RSYNC_OUT" | grep -c '^\.d')
              TOTAL_BYTES=$(echo "$RSYNC_OUT" | grep '^total size' | awk '{print $4, "bytes"}')
              echo "  New files:      $NEW"
              echo "  Modified files: $MOD"
              echo "  Deleted files:  $DEL"
              echo "  Dir changes:    $DIRCHG"
              echo "  Total size:     $TOTAL_BYTES"

              [ $NEW -gt 0 ] && {
                echo ""
                echo "[$TS] NEW files copied:"
                echo "$RSYNC_OUT" | grep '^>f++++++++++' | awk '{print "  + " $2, "(size:", $4 ")"}'
              }
              [ $MOD -gt 0 ] && {
                echo ""
                echo "[$TS] MODIFIED files:"
                echo "$RSYNC_OUT" | grep -E '^>f\.' | grep -v '^>f++++++++++' | awk '{print "  ~ " $2, "[" $1 "]"}'
              }
              [ $DEL -gt 0 ] && {
                echo ""
                echo "[$TS] DELETED files:"
                echo "$RSYNC_OUT" | grep '^\*deleting' | awk '{print "  - " $4}'
              }

              if [ $RSYNC_EXIT -ne 0 ]; then
                echo ""
                echo "[$TS] !! RSYNC EXIT CODE: $RSYNC_EXIT (FAILED) !!"
                ERRORS=$(echo "$RSYNC_OUT" | grep -iE "failed|error|permission denied|no space" | head -5)
                if [ -n "$ERRORS" ]; then
                  echo "  Errors found:"
                  echo "$ERRORS" | sed 's/^/    /'
                fi
              else
                echo ""
                echo "[$TS] Rsync exit code: 0 (SUCCESS)"
              fi

              echo ""
              echo "[$TS] Files AFTER sync:"
              echo "  /dst/ ($(ls /dst/ 2>/dev/null | wc -l) entries):"
              ls -la /dst/ 2>/dev/null | tail -n +2 | awk '{print "    " $0}'

              echo ""
              echo "[$TS] MD5 integrity check:"
              SRC_FILES=$(ls /src/ | sort)
              DST_FILES=$(ls /dst/ | sort)
              if [ "$SRC_FILES" = "$DST_FILES" ]; then
                INTEGRITY_OK=1
                INTEGRITY_COUNT=0
                for f in $SRC_FILES; do
                  if [ -f "/src/$f" ] && [ -f "/dst/$f" ]; then
                    S=$(md5sum "/src/$f" | awk '{print $1}')
                    D=$(md5sum "/dst/$f" | awk '{print $1}')
                    if [ "$S" = "$D" ]; then
                      echo "  OK       $f"
                      INTEGRITY_COUNT=$((INTEGRITY_COUNT+1))
                    else
                      echo "  MISMATCH $f (src:$S dst:$D)"
                      INTEGRITY_OK=0
                    fi
                  fi
                done
                if [ $INTEGRITY_OK -eq 1 ]; then
                  echo "  [ALL $INTEGRITY_COUNT FILES OK - data integrity verified]"
                else
                  echo "  [INTEGRITY CHECK FAILED]"
                fi
              else
                echo "  File lists differ:"
                diff <(ls /src/) <(ls /dst/) | sed 's/^/    /'
              fi

              echo ""
              echo "[$TS] ITERATION #$ITER done. Sleeping 300s..."
              echo "========================================================"
            } | tee -a $LOG_FILE

            sleep 300
          done
      volumeMounts:
        - name: src
          mountPath: /src
          readOnly: true
        - name: dst
          mountPath: /dst
        - name: log
          mountPath: /var/log
      resources:
        requests:
          cpu: 50m
          memory: 96Mi
  volumes:
    - name: src
      persistentVolumeClaim:
        claimName: data-filewriter-0
    - name: dst
      persistentVolumeClaim:
        claimName: data-filewriter-nfs-0
    - name: log
      persistentVolumeClaim:
        claimName: rsync-helper-log-0